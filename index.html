<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>立冬快乐</title>
<!-- 立冬 · 光 | v4.0 | 基于 canvas-confetti 1.9.3 (12849★) + CSS 3D -->
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07040c}
body{font-family:"YouYuan","幼圆","Microsoft YaHei",sans-serif;user-select:none}

#bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 65% 50% at 50% 45%, #2a0716 0%, #14040d 45%, #07040c 100%)}
#bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 100%, rgba(255,60,110,.18), transparent 60%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;display:block}

/* ---------- 开场 ---------- */
#intro{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;transition:opacity 1s ease;cursor:pointer}
#intro.gone{opacity:0;pointer-events:none}
#intro .big{font-size:clamp(44px,13vw,86px);letter-spacing:.14em;padding-left:.14em;
  color:#fff2f6;font-weight:700;
  text-shadow:0 0 22px rgba(255,70,130,.95),0 0 60px rgba(255,45,105,.65),0 0 120px rgba(255,40,100,.4);
  animation:glow 2.6s ease-in-out infinite}
@keyframes glow{
  0%,100%{text-shadow:0 0 22px rgba(255,70,130,.9),0 0 60px rgba(255,45,105,.6),0 0 120px rgba(255,40,100,.32)}
  50%{text-shadow:0 0 34px rgba(255,110,160,1),0 0 90px rgba(255,60,120,.85),0 0 170px rgba(255,50,110,.55)}}
#intro .sub{font-size:clamp(12px,3.4vw,15px);letter-spacing:.66em;padding-left:.66em;color:#ff9cbb;opacity:.9}
#intro .hint{position:absolute;bottom:15%;font-size:clamp(13px,3.6vw,15px);
  letter-spacing:.46em;padding-left:.46em;color:#ffc6d8;animation:tp 2.2s ease-in-out infinite}
@keyframes tp{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- 3D 文字环 ---------- */
#stage{position:fixed;inset:0;z-index:3;perspective:1050px;perspective-origin:50% 46%;
  opacity:0;transition:opacity 1.6s ease;pointer-events:none}
#stage.on{opacity:1}
.ring{position:absolute;left:50%;top:46%;width:0;height:0;
  transform-style:preserve-3d}
.item{position:absolute;left:0;top:0;white-space:nowrap;
  color:#fff4f9;font-size:20px;letter-spacing:.06em;font-weight:700;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  text-shadow:0 0 10px rgba(255,120,165,1),0 0 26px rgba(255,60,120,.95),0 0 60px rgba(255,45,105,.7);
  will-change:transform,opacity;transition:opacity .22s linear}

/* 主句 */
#mainline{position:fixed;left:0;right:0;bottom:11%;z-index:5;text-align:center;
  font-size:clamp(17px,4.6vw,26px);letter-spacing:.3em;padding-left:.3em;
  color:#ffe1ec;opacity:0;transition:opacity 2s ease;
  text-shadow:0 0 20px rgba(255,80,140,.9),0 0 50px rgba(255,50,110,.55)}
#mainline.on{opacity:1}

#again{position:fixed;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9;
  font-size:12px;color:#ff9cbb;letter-spacing:.1em;padding:8px 13px;border-radius:999px;
  border:1px solid rgba(255,120,160,.25);background:rgba(40,0,16,.45);
  opacity:0;pointer-events:none;transition:opacity 1s ease;cursor:pointer}
#again.on{opacity:.5;pointer-events:auto}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="fx"></canvas>

<div id="intro">
  <div class="big">立冬快乐</div>
  <div class="sub">愿 你 三 冬 暖</div>
  <div class="hint">轻 触 屏 幕</div>
</div>

<div id="stage"><div class="ring" id="ring"></div></div>
<div id="mainline">冬 至 有 暖 · 岁 岁 平 安</div>
<div id="again">再 来 一 次</div>

<script>
(function(){
"use strict";
var W=window.innerWidth, H=window.innerHeight;
var started=false;

var PINK=['#ff3b63','#ff5c8d','#ff8fb0','#ffc2d8','#fff0f5'];
var GOLD=['#ffd9a0','#ffe9c4','#fff6e6','#ffb877'];
var ALL=PINK.concat(GOLD);

/* ---- 粒子形状：用文字做形状，爱心和星星 ---- */
var heartShape=null, starShape=null, sparkShape=null;
try{
  heartShape=confetti.shapeFromText({text:'❤', scalar:2.4, color:'#ff3b63'});
  starShape=confetti.shapeFromText({text:'✦', scalar:2.2, color:'#ffd9a0'});
  sparkShape=confetti.shapeFromText({text:'✧', scalar:1.6, color:'#fff0f5'});
}catch(e){ /* 老浏览器不支持就用默认形状 */ }

var MY=null;
try{
  MY=confetti.create(document.getElementById('fx'), {resize:true, useWorker:true});
}catch(e){ MY=confetti; }

function fire(opts){
  try{ (MY||confetti)(opts); }catch(e){}
}

/* ---- 第一波：满屏爱心炸开 ---- */
function waveHearts(){
  fire({
    particleCount:150, spread:360, startVelocity:52, origin:{x:0.5,y:0.46},
    gravity:0.55, drift:0, ticks:300, scalar:1.5,
    shapes: heartShape?[heartShape]:undefined, colors: PINK
  });
  setTimeout(function(){
    fire({
      particleCount:110, spread:360, startVelocity:38, origin:{x:0.5,y:0.46},
      gravity:0.45, drift:0, ticks:320, scalar:1.1,
      shapes: heartShape?[heartShape]:undefined, colors: PINK
    });
  },180);
  setTimeout(function(){
    fire({
      particleCount:120, spread:360, startVelocity:62, origin:{x:0.5,y:0.42},
      gravity:0.7, drift:0, ticks:280, scalar:1.3,
      shapes: starShape?[starShape]:undefined, colors: GOLD
    });
  },340);
}

/* ---- 持续飘落：雪 + 星火 ---- */
function startRain(){
  var tick=0;
  setInterval(function(){
    tick++;
    var y=-0.08;
    fire({
      particleCount:2, angle:270, spread:44,
      origin:{x:Math.random(), y:y},
      gravity:0.34, drift:(Math.random()-0.5)*0.9,
      ticks:520, scalar:0.85,
      shapes: (tick%3===0 && sparkShape)?[sparkShape]:undefined,
      colors: (tick%2===0)?GOLD:['#ffffff','#ffe9f0']
    });
    if(tick%4===0){
      fire({
        particleCount:1, angle:270, spread:20,
        origin:{x:Math.random(), y:-0.05},
        gravity:0.22, drift:(Math.random()-0.5)*0.6,
        ticks:700, scalar:0.6, colors:['#ffffff']
      });
    }
  }, 210);
}

/* ---- 3D 文字环 ---- */
var LINES=[
  '愿你三冬暖','愿你春不寒','愿你天黑有灯','下雨有伞',
  '愿你一路上','有良人相伴','愿你所有快乐','无需假装',
  '愿你此生尽兴','赤诚善良','立冬快乐','岁岁平安',
  '愿你被爱','岁岁如意','暖冬常在','喜乐安康',
  '冬天很冷','但爱很暖','愿你被偏爱','四季有光',
  '愿你有人等','愿你有灯留','愿你不孤单','愿你常欢喜',
  '所求皆如愿','所行化坦途'
];

var items=[], spinStart=0;
function spin(now){
  var deg=((now-spinStart)*0.0129)%360;
  document.getElementById('ring').style.transform='rotateY('+deg+'deg)';
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var a=(it.ang+deg)*Math.PI/180;
    var c=Math.cos(a);
    it.el.style.opacity = c>0.74 ? Math.min(1, (c-0.74)*3.4) : 0;
  }
  requestAnimationFrame(spin);
}

function buildRing(){
  var ring=document.getElementById('ring');
  var isPhone=W<620;
  var R=isPhone? Math.min(W*0.27, 130) : Math.min(W*0.30, H*0.58);
  var fs=isPhone? 14 : 21;
  var n=LINES.length;

  for(var i=0;i<n;i++){
    var ang=(360/n)*i;
    var el=document.createElement('div');
    el.className='item';
    el.textContent=LINES[i];
    el.style.fontSize=fs+'px';
    var yBase=(i%4-1.5)*(isPhone?58:84);
    var yJit=(Math.random()-0.5)*14;
    el.style.transform='translateX(-50%) translateY('+(yBase+yJit)+'px) rotateY('+ang+'deg) translateZ('+R+'px)';
    ring.appendChild(el);
    items.push({el:el, ang:ang});
  }
  document.getElementById('stage').classList.add('on');
  spinStart=performance.now();
  requestAnimationFrame(spin);
}

/* ---- 启动 ---- */
function begin(){
  if(started) return;
  started=true;
  document.getElementById('intro').classList.add('gone');
  setTimeout(function(){
    waveHearts();
    startRain();
  },120);
  setTimeout(buildRing,900);
  setTimeout(function(){ document.getElementById('mainline').classList.add('on'); },2400);
  setTimeout(function(){ document.getElementById('again').classList.add('on'); },3400);
}

document.getElementById('intro').addEventListener('click',begin);
document.getElementById('intro').addEventListener('touchstart',function(e){ e.preventDefault(); begin(); },{passive:false});
document.getElementById('again').addEventListener('click',function(){ location.reload(); });

window.addEventListener('resize',function(){
  W=window.innerWidth; H=window.innerHeight;
});
})();
</script>
</body>
