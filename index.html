<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>立冬快乐</title>
<!-- 立冬祝福页 v1.0 | 构建 2026-11-07 | 纯离线单文件，无任何外链 -->
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05040a}
body{
  font-family:"KaiTi","STKaiti","Kaiti SC","Songti SC","SimSun",serif;
  color:#ffd9e3;-webkit-font-smoothing:antialiased;
  user-select:none;
}
#bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 62% 52% at 50% 46%, rgba(126,9,42,.55), transparent 70%),
    radial-gradient(ellipse 95% 72% at 50% 102%, rgba(64,4,28,.9), transparent 76%),
    #05040a;
}
#fx{position:fixed;inset:0;z-index:2;display:block}
#wishes{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}

/* ---------- 信封 ---------- */
#envwrap{
  position:fixed;inset:0;z-index:6;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .85s ease;
}
#envwrap.gone{opacity:0;pointer-events:none}
.env{
  position:relative;
  width:min(80vw,392px);
  aspect-ratio:1.52;
  perspective:1100px;
  cursor:pointer;
  filter:drop-shadow(0 22px 46px rgba(255,40,90,.32));
  animation:floaty 4.6s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

.env-back{
  position:absolute;inset:0;border-radius:10px;z-index:1;
  background:linear-gradient(155deg,#a5122f 0%,#6e0620 48%,#3d0212 100%);
  box-shadow:inset 0 0 0 1px rgba(255,190,210,.20), inset 0 0 40px rgba(0,0,0,.45);
}
.letter{
  position:absolute;left:5%;top:6%;width:90%;height:86%;z-index:2;
  border-radius:4px;
  background:linear-gradient(178deg,#fff6f2 0%,#ffe6ec 55%,#ffd3de 100%);
  box-shadow:0 8px 22px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;
  transition:transform 1.15s cubic-bezier(.22,.9,.24,1), opacity .9s ease;
}
.letter .lt{font-size:clamp(30px,9vw,46px);font-weight:700;color:#c3123f;letter-spacing:.14em;
  text-shadow:0 1px 0 #fff,0 3px 8px rgba(195,18,63,.22)}
.letter .ls{font-size:clamp(11px,3.2vw,14px);color:#b07a8c;letter-spacing:.42em;padding-left:.42em}
.letter .lrule{width:46%;height:1px;background:linear-gradient(90deg,transparent,#e9a6b8,transparent)}

.env-front{
  position:absolute;inset:0;z-index:3;border-radius:10px;
  background:linear-gradient(165deg,#c01338 0%,#7a0a26 55%,#4a0515 100%);
  clip-path:polygon(0 0,50% 44%,100% 0,100% 100%,0 100%);
  box-shadow:inset 0 -18px 40px rgba(0,0,0,.35);
}
.env-front::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,rgba(255,255,255,.13),transparent 42%);
  clip-path:polygon(0 0,50% 44%,100% 0,100% 100%,0 100%);
}
.env-flap{
  position:absolute;left:0;top:0;width:100%;height:62%;z-index:4;
  background:linear-gradient(168deg,#d81f4c 0%,#a80f33 60%,#7d0a25 100%);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  transform:rotateX(0deg);
  transition:transform 1s cubic-bezier(.6,0,.36,1);
  backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;
  padding-top:13%;
  gap:10px;
  box-shadow:inset 0 0 0 1px rgba(255,200,215,.16);
}
.env.open .env-flap{transform:rotateX(-174deg)}
.env.open .letter{transform:translateY(-30%) scale(1.02)}
.env.open #tip{opacity:0}

.env-title{
  font-size:clamp(26px,8.4vw,40px);font-weight:700;color:#ffe3ea;letter-spacing:.16em;
  padding-left:.16em;
  text-shadow:0 0 20px rgba(255,110,150,.85),0 0 46px rgba(255,50,100,.5),0 2px 0 rgba(90,0,20,.6);
}
.env-sub{font-size:clamp(10px,2.8vw,12px);color:#ffb7c9;letter-spacing:.34em;padding-left:.34em;opacity:.85}
#tip{
  position:absolute;left:0;right:0;bottom:-64px;text-align:center;z-index:5;
  font-size:clamp(13px,3.6vw,16px);color:#ff9ab5;letter-spacing:.5em;padding-left:.5em;
  animation:tpulse 2.1s ease-in-out infinite;transition:opacity .5s ease;
}
@keyframes tpulse{0%,100%{opacity:.38}50%{opacity:1}}

/* ---------- 祝福语 ---------- */
.wish{
  position:absolute;text-align:center;
  color:#ffb0c6;
  text-shadow:0 0 16px rgba(255,50,105,.55),0 2px 3px rgba(50,0,14,.75);
  letter-spacing:.02em;line-height:1.6;text-wrap:balance;
  opacity:0;
  transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(.86);
  transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.9,.24,1);
  will-change:opacity,transform;
}
.wish.on{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1)}
.wish.hl{color:#fff0f5;text-shadow:0 0 22px rgba(255,90,140,.9),0 2px 4px rgba(50,0,14,.8)}

#again{
  position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:9;font-size:13px;color:#ff8dab;letter-spacing:.1em;
  padding:9px 15px;border-radius:999px;
  border:1px solid rgba(255,110,150,.3);background:rgba(60,0,20,.35);
  opacity:0;pointer-events:none;transition:opacity .8s ease;cursor:pointer;
}
#again.on{opacity:.55;pointer-events:auto}
#again:active{opacity:1}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="fx"></canvas>
<div id="wishes"></div>

<div id="envwrap">
  <div class="env" id="env">
    <div class="env-back"></div>
    <div class="letter">
      <div class="lt">立冬快乐</div>
      <div class="lrule"></div>
      <div class="ls">冬已至 · 愿你暖</div>
    </div>
    <div class="env-front"></div>
    <div class="env-flap">
      <div class="env-title">立冬快乐</div>
      <div class="env-sub">L I D O N G</div>
    </div>
    <div id="tip">点 击 打 开</div>
  </div>
</div>

<div id="again">↻ 再看一次</div>

<script>
(function(){
"use strict";

var cvs=document.getElementById('fx'), ctx=cvs.getContext('2d');
var FONT='"KaiTi","STKaiti","Kaiti SC","Songti SC","SimSun",serif';
var W=0,H=0,DPR=1,CY=0;

/* -------- 文案池 -------- */
var HEART_WORDS=[
  '立冬快乐','立冬快乐','立冬快乐','立冬快乐','立冬快乐','立冬快乐','立冬快乐',
  '立冬安康','冬日安暖','愿你温暖','岁岁平安','心有暖阳','一切顺遂','常乐无忧',
  '愿你开心','仅剩开心','暖冬如意','万事胜意','平安喜乐','好日常在','岁月温柔',
  '愿你被爱','冬日可爱','顺问冬安','藏好温暖','立冬快乐','立冬快乐'
];
var DARK=['#5e0016','#78001d','#8d0022','#a8002b'];
var LIGHT=['#ff3b63','#ff5c7f','#ff7a95','#ff98b0','#ffb8cb'];

var WISHES=[
  '立冬快乐，三冬暖',
  '愿你的日子仅剩开心',
  '天冷了，记得添衣',
  '愿你被温柔以待',
  '冬天会冷，爱会暖',
  '愿美好如期而至',
  '立冬安康，岁岁欢喜',
  '眼里有光，心中有暖',
  '这一冬，万事胜意',
  '春天就不远了',
  '每天都有小确幸',
  '愿你所愿皆成',
  '手心有暖，眼里有光',
  '有人陪你吃火锅',
  '笑口常开，烦恼不在',
  '立冬到，福气满满',
  '岁月温柔，不负自己',
  '温暖刚好够用',
  '想要的都拥有',
  '立冬快乐，一切安好'
];

/* -------- 状态 -------- */
var state='idle';
var parts=[], stars=[], cache=null;
var tStart=0, doneAt=0, buildEnd=0;
var BOOM_DUR=1.45;

function clamp(v,a,b){return v<a?a:(v>b?b:v);}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR);
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CY=H*0.47;
  cache=null;
  buildStars();
  if(state==='idle'){ /* 预生成 */ }
  buildHeart();
  if(state==='settle'||state==='heart') { /* 重建后重画 */ }
  if(state==='settle') snapshot();
}

function buildStars(){
  stars=[];
  var n=Math.round(clamp(W*H/16000,46,110));
  for(var i=0;i<n;i++){
    stars.push({x:Math.random(),y:Math.random(),r:0.5+Math.random()*1.5,
      ph:Math.random()*6.28,sp:0.4+Math.random()*1.4});
  }
}

/* -------- 心形 -------- */
function raw(t){
  return {
    x:16*Math.pow(Math.sin(t),3),
    y:13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)
  };
}

function buildHeart(){
  parts=[];
  var scx=Math.min(W*0.86/32, H*0.62/(29*1.18));
  var scy=scx*1.18;
  var cx=W/2, cy=CY;
  function map(p){ return {x:cx+p.x*scx, y:cy-(p.y+2.5)*scy}; }

  var SAMP=1400, pts=[];
  for(var i=0;i<SAMP;i++){
    pts.push(map(raw(i/SAMP*Math.PI*2)));
  }
  var acc=[0];
  for(var i2=1;i2<=SAMP;i2++){
    var a=pts[i2-1], b=pts[i2%SAMP];
    acc.push(acc[i2-1]+Math.hypot(b.x-a.x,b.y-a.y));
  }
  var total=acc[SAMP];
  var N=W<600?64:88;
  var outline=[];
  for(var k=0;k<N;k++){
    var target=total*k/N, j=1;
    while(j<acc.length && acc[j]<target) j++;
    outline.push(pts[Math.min(j-1,SAMP-1)]);
  }

  var M=W<600?30:46;
  var inner=[];
  for(var m=0;m<M;m++){
    var t=Math.random()*Math.PI*2;
    var rr=0.18+Math.random()*0.55;
    var p=raw(t);
    inner.push(map({x:p.x*rr, y:(p.y+2.5)*rr-2.5}));
  }

  var baseSize=clamp(scx*1.16, 9, 26);
  var all=[];
  outline.forEach(function(p){ all.push({x:p.x,y:p.y,size:baseSize,inner:false}); });
  inner.forEach(function(p){ all.push({x:p.x,y:p.y,size:baseSize*0.78,inner:true}); });

  var ys=all.map(function(p){return p.y;});
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  var DUR=4.1;

  all.forEach(function(p,idx){
    var ny=(p.y-minY)/Math.max(1,(maxY-minY)); /* 0=顶 1=底 */
    var delay=(1-ny)*DUR + Math.random()*0.55;
    p.text=HEART_WORDS[Math.floor(Math.random()*HEART_WORDS.length)];
    p.delay=delay;
    p.thick=W<600?4:6;
    p.dark=DARK[Math.floor(Math.random()*DARK.length)];
    p.light=LIGHT[Math.floor(Math.random()*LIGHT.length)];
    p.rot=(Math.random()-0.5)*(p.inner?0.30:0.16);
    p.seed=Math.random()*6.28;
    parts.push(p);
  });

  buildEnd=DUR+1.15;
}

/* -------- 绘制单个立体字 -------- */
function glyph(c,p,x,y,sc,alpha,rot){
  if(alpha<=0.005) return;
  c.save();
  c.globalAlpha=alpha;
  c.translate(x,y);
  if(rot) c.rotate(rot);
  if(sc!==1) c.scale(sc,sc);
  c.font='700 '+p.size+'px '+FONT;
  c.textAlign='center';
  c.textBaseline='middle';

  var th=p.thick;
  var off=p.size*0.068;
  for(var k=th;k>=1;k--){
    c.fillStyle=p.dark;
    c.fillText(p.text, k*off, k*off*1.12);
  }
  c.shadowColor='rgba(255,45,95,'+(0.5*alpha)+')';
  c.shadowBlur=p.size*0.7;
  c.fillStyle=p.light;
  c.fillText(p.text,0,0);
  c.shadowBlur=0;
  c.globalAlpha=alpha*0.62;
  c.fillStyle='#fff6f9';
  c.fillText(p.text,-off*0.8,-off*1.0);
  c.restore();
}

/* -------- 背景星点 -------- */
function drawStars(now){
  ctx.save();
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    var y=((s.y - now*0.000006*s.sp)%1+1)%1;
    var tw=0.28+0.42*(0.5+0.5*Math.sin(now*0.0011*s.sp+s.ph));
    ctx.globalAlpha=tw;
    ctx.fillStyle='#ff9ab5';
    ctx.beginPath();
    ctx.arc(s.x*W,y*H,s.r,0,6.2832);
    ctx.fill();
  }
  ctx.restore();
}

/* -------- 心形构建期 -------- */
function drawBuilding(el){
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    var prog=(el-p.delay)/0.52;
    if(prog<=0) continue;
    var e=clamp(prog,0,1);
    var ease=1-Math.pow(1-e,3);
    var alpha=clamp(e*1.7,0,1);
    var sc=1.85-0.85*ease;
    var dy=(1-ease)*30;
    glyph(ctx,p,p.x,p.y+dy,sc,alpha,p.rot);
  }
}

function snapshot(){
  var oc=document.createElement('canvas');
  oc.width=cvs.width; oc.height=cvs.height;
  var o=oc.getContext('2d');
  o.setTransform(DPR,0,0,DPR,0,0);
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    glyph(o,p,p.x,p.y,1,1,p.rot);
  }
  cache=oc;
}

function drawStatic(now){
  var t=(now-doneAt)/1000;
  var pulse=1+Math.sin(t*2.6)*0.017;
  ctx.save();
  ctx.translate(W/2,CY);
  ctx.scale(pulse,pulse);
  ctx.translate(-W/2,-CY);
  if(cache) ctx.drawImage(cache,0,0,W,H);
  else { for(var i=0;i<parts.length;i++) glyph(ctx,parts[i],parts[i].x,parts[i].y,1,1,parts[i].rot); }
  ctx.restore();
}

/* -------- 爆炸 -------- */
function enterBoom(now){
  state='boom'; tStart=now;
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    var dx=p.x-W/2, dy=p.y-CY;
    var d=Math.hypot(dx,dy)||1;
    var sp=300+Math.random()*520;
    p.vx=dx/d*sp+(Math.random()-0.5)*110;
    p.vy=dy/d*sp-150-Math.random()*110;
    p.x0=p.x; p.y0=p.y;
    p.rot0=p.rot;
    p.vr=(Math.random()-0.5)*6;
  }
}

function drawBoom(now){
  var t=(now-tStart)/1000;
  var k=clamp(t/BOOM_DUR,0,1);

  /* 放射光 */
  if(t<0.55){
    var pa=1-t/0.55;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(var ri=0;ri<18;ri++){
      var ang=ri/18*6.2832+0.17;
      var ln=(0.35+0.65*Math.min(1,t/0.13))*Math.max(W,H)*0.82*pa;
      var lg=ctx.createLinearGradient(W/2,CY,W/2+Math.cos(ang)*ln,CY+Math.sin(ang)*ln);
      lg.addColorStop(0,'rgba(255,205,225,'+(0.62*pa)+')');
      lg.addColorStop(0.45,'rgba(255,80,125,'+(0.28*pa)+')');
      lg.addColorStop(1,'rgba(255,40,90,0)');
      ctx.strokeStyle=lg;
      ctx.lineWidth=7*pa+0.5;
      ctx.beginPath();ctx.moveTo(W/2,CY);
      ctx.lineTo(W/2+Math.cos(ang)*ln,CY+Math.sin(ang)*ln);ctx.stroke();
    }
    ctx.restore();
  }

  /* 冲击波 */
  var rt=t*1500;
  var wa=clamp(1-t/0.95,0,1);
  if(wa>0){
    ctx.save();
    ctx.strokeStyle='rgba(255,175,205,'+(wa*0.85)+')';
    ctx.lineWidth=14*wa+1;
    ctx.beginPath(); ctx.arc(W/2,CY,rt,0,6.2832); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,'+(wa*0.4)+')';
    ctx.lineWidth=5*wa+0.6;
    ctx.beginPath(); ctx.arc(W/2,CY,rt*0.82,0,6.2832); ctx.stroke();
    ctx.restore();
  }

  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    var alpha=clamp(1-t/1.25,0,1);
    if(alpha<=0) continue;
    var x=p.x0+p.vx*t;
    var y=p.y0+p.vy*t+0.5*820*t*t;
    glyph(ctx,p,x,y,1+t*0.42,alpha*0.95,p.rot0+p.vr*t);
  }

  /* 爆闪 */
  if(t<0.28){
    ctx.save();
    ctx.globalAlpha=(1-t/0.28)*0.4;
    ctx.fillStyle='#ffd7e4';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

/* -------- 主循环 -------- */
var FZ=(function(){
  var m=(location.hash||'').match(/fz=([a-z]+):([0-9.]+)/);
  return m?{stage:m[1],t:parseFloat(m[2])}:null;
})();
var fzOn=false, fzBase=0;

function frame(now){
  if(FZ && state===FZ.stage){
    if(!fzOn){ fzOn=true; fzBase=performance.now()-FZ.t*1000; tStart=fzBase; doneAt=fzBase; }
    now=fzBase+FZ.t*1000;
  }
  window.__stage=state;
  ctx.clearRect(0,0,W,H);
  drawStars(now);

  if(state==='heart'){
    var el=(now-tStart)/1000;
    drawBuilding(el);
    if(el>buildEnd){ state='settle'; doneAt=now; snapshot(); }
  } else if(state==='settle'){
    drawStatic(now);
    if(now-doneAt>1150) enterBoom(now);
  } else if(state==='boom'){
    drawBoom(now);
    if((now-tStart)/1000>BOOM_DUR) { state='final'; showWishes(); }
  }

  requestAnimationFrame(frame);
}

/* -------- 祝福语 -------- */
var wished=false;
function showWishes(){
  if(wished) return;
  wished=true;
  var host=document.getElementById('wishes');
  var cols=(W<620)?2:(W<1000?4:5);
  var rows=Math.ceil(WISHES.length/cols);
  var safeB=(W<620)?36:60;
  var cellW=W/cols, cellH=(H-safeB)/rows;
  var fs=(W<620)?16:22;
  fs=Math.min(fs, cellW*0.12);
  var jitY=(W<620)?0.16:0.18;
  var jitX=(W<620)?0.05:0.06;

  WISHES.forEach(function(tx,i){
    var c=i%cols, r=Math.floor(i/cols);
    var el=document.createElement('div');
    el.className='wish'+(i%7===0?' hl':'');
    el.textContent=tx;
    var jx=(Math.random()-0.5)*cellW*jitX;
    var jy=(Math.random()-0.5)*cellH*jitY;
    el.style.left=clamp(c*cellW+cellW/2+jx, cellW*0.5, W-cellW*0.5)+'px';
    el.style.top=clamp(r*cellH+cellH/2+jy, cellH*0.5, H-safeB-cellH*0.5)+'px';
    el.style.width=Math.floor(cellW*0.86)+'px';
    el.style.fontSize=fs.toFixed(1)+'px';
    el.style.setProperty('--rot',((Math.random()-0.5)*7).toFixed(1)+'deg');
    host.appendChild(el);
    setTimeout(function(){ el.classList.add('on'); }, 90+i*72);
  });

  var ag=document.getElementById('again');
  setTimeout(function(){ ag.classList.add('on'); }, 1600);
}

/* -------- 启动流程 -------- */
var envwrap=document.getElementById('envwrap');
var env=document.getElementById('env');

function startHeart(){
  envwrap.classList.add('gone');
  setTimeout(function(){ envwrap.style.display='none'; }, 900);
  parts.forEach(function(p){ p.delay=p.delay*0; }); /* 保持 */
  buildHeart();
  tStart=performance.now();
  state='heart';
}

env.addEventListener('click',function(){
  if(state!=='idle') return;
  state='opening';
  env.classList.add('open');
  setTimeout(function(){
    envwrap.style.opacity='0.0';
  },1000);
  setTimeout(startHeart,1750);
});

document.getElementById('again').addEventListener('click',function(){
  location.reload();
});

window.addEventListener('resize',function(){
  var s=state;
  resize();
  if(s==='settle'){ snapshot(); }
});

resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
