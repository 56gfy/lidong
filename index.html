<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>立冬 · 第一场雪</title>
<!-- 立冬 · 第一场雪 | v3.0 | 2026-11-07 | 单文件离线 -->
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#04060d}
body{font-family:"KaiTi","STKaiti","Kaiti SC",serif;color:#efe4cc;user-select:none}
#bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 70% 55% at 50% 42%, #101a30 0%, #0a0f1e 45%, #04060d 100%);}
#fx{position:fixed;inset:0;z-index:2;display:block}

/* ---------- 开场 ---------- */
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;transition:opacity 1.1s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro .t1{font-size:clamp(38px,11vw,64px);letter-spacing:.34em;padding-left:.34em;
  color:#f5ecd8;text-shadow:0 0 30px rgba(255,215,150,.35),0 0 70px rgba(255,180,110,.18)}
#intro .t2{margin-top:14px;font-size:clamp(11px,3.2vw,13px);letter-spacing:.62em;padding-left:.62em;
  color:#8fa2c0}
#intro .hint{position:absolute;bottom:14%;font-size:clamp(12px,3.4vw,14px);
  letter-spacing:.5em;padding-left:.5em;color:#c8a878;
  animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.30}50%{opacity:.95}}
#intro .seal{position:absolute;bottom:6.5%;width:34px;height:34px;border-radius:4px;
  border:1px solid rgba(190,60,50,.55);color:#c4503f;font-size:13px;
  display:flex;align-items:center;justify-content:center;letter-spacing:.04em;opacity:.65}

/* ---------- 祝福 ---------- */
.wish{position:fixed;z-index:3;white-space:nowrap;pointer-events:none;
  color:#f6ead2;text-shadow:0 0 30px rgba(4,6,13,.95),0 0 16px rgba(4,6,13,.9),0 2px 5px rgba(0,0,0,.75),0 0 22px rgba(255,205,140,.35);
  opacity:0;transform:translate(-50%,-50%) translateY(-40px);
  transition:opacity 2.4s ease, transform 2.4s cubic-bezier(.2,.8,.3,1)}
.wish.on{opacity:.92;transform:translate(-50%,-50%) translateY(0)}
.wish.dim{opacity:.72}
.wish.main{color:#ffd9a4;text-shadow:0 0 34px rgba(4,6,13,.95),0 0 18px rgba(255,200,130,.55),0 0 60px rgba(255,170,90,.35)}

#again{position:fixed;right:15px;bottom:calc(13px + env(safe-area-inset-bottom));
  z-index:9;font-size:12px;color:#c8a878;letter-spacing:.12em;padding:8px 14px;
  border-radius:999px;border:1px solid rgba(200,168,120,.22);background:rgba(8,12,22,.5);
  opacity:0;pointer-events:none;transition:opacity 1.2s ease;cursor:pointer}
#again.on{opacity:.5;pointer-events:auto}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="fx"></canvas>

<div id="intro">
  <div class="t1">立冬</div>
  <div class="t2">第 一 场 雪</div>
  <div class="hint">轻 触 雪 花</div>
  <div class="seal">冬</div>
</div>

<div id="again">重 来 一 次</div>

<script>
(function(){
"use strict";
var cvs=document.getElementById('fx'), ctx=cvs.getContext('2d');
var W=0,H=0,DPR=1,CX=0,CY=0;

var state='intro', t0=0, flakeRot=0, pulse=0;
var parts=[], wishes=[];
var GATHER=1.7, HOLD=2.1, BURST=1.15;

function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function easeInOutSine(t){return -(Math.cos(Math.PI*t)-1)/2;}

/* ---------- 雪花 ---------- */
function rnd(a,b){var v=Math.sin(a*127.1+b*311.7)*43758.5453;return v-Math.floor(v);}

function drawFlake(cx,cy,R,rot,alpha){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot);
  ctx.lineCap='round';
  ctx.shadowColor='rgba(185,220,255,'+(alpha*0.85)+')';
  ctx.shadowBlur=R*0.30;
  ctx.strokeStyle='rgba(226,238,255,'+(alpha*0.92)+')';
  ctx.lineWidth=Math.max(1,R*0.016);
  for(var i=0;i<6;i++){
    ctx.save();
    var jit=(rnd(i,1)-0.5);
    ctx.rotate(i*Math.PI/3+jit*0.05);
    var rl=R*(0.94+rnd(i,2)*0.12);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-rl);ctx.stroke();
    for(var b=1;b<=3;b++){
      var y=-rl*(0.40+0.17*b+rnd(i,b+3)*0.04), len=rl*(0.24-0.045*b+rnd(i,b+7)*0.05);
      var skew=(rnd(i,b+11)-0.5)*0.4;
      ctx.beginPath();
      ctx.moveTo(0,y);ctx.lineTo(len*0.82,y-len*(0.62+skew));
      ctx.moveTo(0,y);ctx.lineTo(-len*0.82,y-len*(0.62-skew));
      ctx.stroke();
    }
    ctx.fillStyle='rgba(240,248,255,'+(alpha*0.9)+')';
    ctx.shadowBlur=R*0.22;
    ctx.beginPath();ctx.arc(0,-R,R*0.028,0,6.283);ctx.fill();
    ctx.restore();
  }
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,'+(alpha*0.85)+')';
  ctx.beginPath();ctx.arc(0,0,R*0.05,0,6.283);ctx.fill();
  ctx.restore();
}

/* ---------- 心形取点 ---------- */
function heartPoint(t){
  return {
    x:16*Math.pow(Math.sin(t),3),
    y:13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)
  };
}

function buildParticles(){
  parts=[];
  var scx=Math.min(W*0.80/32, H*0.50/(29*1.2));
  var scy=scx*1.2;
  var mx=W/2, my=H*0.46;
  function map(p){ return {x:mx+p.x*scx, y:my-(p.y+2.5)*scy}; }

  /* 按弧长建表：心形公式在中轴附近横坐标变化极慢，直接均匀取 t 会堆成一条竖线 */
  var SAMP=1400, tbl=[], tot=0, prev=heartPoint(0);
  for(var si=1;si<=SAMP;si++){
    var st=si/SAMP*Math.PI*2, pt=heartPoint(st);
    tot+=Math.hypot(pt.x-prev.x, pt.y-prev.y);
    tbl.push({t:st, s:tot});
    prev=pt;
  }
  function tAt(sv){
    var lo=0,hi=tbl.length-1;
    while(lo<hi){var mid=(lo+hi)>>1; if(tbl[mid].s<sv) lo=mid+1; else hi=mid;}
    return tbl[lo].t;
  }

  /* 轮廓多边形，用来判断点是不是落在心里面 */
  var poly=[], bx0=1e9, by0=1e9, bx1=-1e9, by1=-1e9;
  for(var pi=0;pi<180;pi++){
    var pp=map(heartPoint(pi/180*Math.PI*2));
    poly.push(pp);
    if(pp.x<bx0)bx0=pp.x; if(pp.x>bx1)bx1=pp.x;
    if(pp.y<by0)by0=pp.y; if(pp.y>by1)by1=pp.y;
  }
  function inHeart(px,py){
    var ins=false;
    for(var a=0,b=poly.length-1;a<poly.length;b=a++){
      var xi=poly[a].x, yi=poly[a].y, xj=poly[b].x, yj=poly[b].y;
      if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) ins=!ins;
    }
    return ins;
  }
  function randInner(){
    for(var k=0;k<40;k++){
      var rx=bx0+Math.random()*(bx1-bx0), ry=by0+Math.random()*(by1-by0);
      if(inHeart(rx,ry)) return {x:rx, y:ry};
    }
    return {x:W/2, y:H*0.46};
  }

  var N=W<620?620:900;        /* 手机少一点，保帧率 */
  for(var i=0;i<N;i++){
    var onEdge=(i%10)<6;      /* 六成贴在轮廓上，四成填里面，心形才实 */
    var target;
    if(onEdge){
      var t=tAt(((i+Math.random())/N)*tot);
      target=map(heartPoint(t));
    }else{
      target=randInner();
    }
    var ang=Math.random()*Math.PI*2;
    var dist=40+Math.random()*260;
    parts.push({
      x0:mx+Math.cos(ang)*dist*0.4,
      y0:my+Math.sin(ang)*dist*0.4,
      tx:target.x, ty:target.y,
      x:0,y:0, vx:0,vy:0,
      sz:1.1+Math.random()*1.9,
      hue:Math.random(),
      d:Math.random()*0.5,
      ph:Math.random()*6.283,
      edge:onEdge
    });
  }
}

/* ---------- 主循环 ---------- */
function frame(now){
  if(!t0) t0=now;
  var el=(now-t0)/1000;
  window.__stage=state;
  ctx.clearRect(0,0,W,H);

  /* 底光 */
  var gg=ctx.createRadialGradient(W/2,H*0.46,0,W/2,H*0.46,Math.max(W,H)*0.62);
  var glowA=(state==='intro')?0.10:0.22;
  gg.addColorStop(0,'rgba(255,205,145,'+glowA+')');
  gg.addColorStop(1,'rgba(255,205,145,0)');
  ctx.fillStyle=gg;
  ctx.fillRect(0,0,W,H);

  if(state==='intro'){
    flakeRot+=0.0012;
    var grow=easeOutCubic(clamp(el/1.5,0,1));
    var R=Math.min(W,H)*0.115*(0.25+0.75*grow);
    var a=(0.72+0.28*Math.sin(now*0.0012))*grow;
    drawFlake(W/2,H*0.40,R,flakeRot,a);
    /* 碎晶：打破完美对称的图标感 */
    ctx.save();
    for(var ci=0;ci<26;ci++){
      var ang0=rnd(ci,21)*6.283, rad0=R*(0.72+rnd(ci,22)*0.85);
      var px0=W/2+Math.cos(ang0)*rad0, py0=H*0.40+Math.sin(ang0)*rad0*0.95;
      var tw0=0.25+0.55*Math.abs(Math.sin(now*0.0011+ci));
      ctx.fillStyle='rgba(214,232,255,'+(tw0*a*0.75)+')';
      ctx.beginPath();ctx.arc(px0,py0,0.7+rnd(ci,23)*1.5,0,6.283);ctx.fill();
    }
    ctx.restore();
    /* 一圈慢慢落的雪 */
    drawFallingSnow(now, 0.35);
  }
  else if(state==='gather'){
    var p=clamp(el/GATHER,0,1);
    var e=easeOutCubic(p);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<parts.length;i++){
      var q=parts[i];
      var ee=clamp((e-q.d*0.12)/0.88,0,1);
      ee=easeOutCubic(ee);
      var arc=Math.sin(ee*Math.PI)*36*(q.hue-0.5);
      q.x=q.x0+(q.tx-q.x0)*ee;
      q.y=q.y0+(q.ty-q.y0)*ee+arc;
      drawDot(q, 0.25+0.75*ee);
    }
    ctx.restore();
    if(p>=1){ state='hold'; t0=now; }
  }
  else if(state==='hold'){
    pulse=(now-t0)/1000;
    var beat=1+0.030*Math.sin(pulse*3.1);
    ctx.save();
    ctx.translate(W/2,H*0.46);
    ctx.scale(beat,beat);
    ctx.translate(-W/2,-H*0.46);
    ctx.globalCompositeOperation='lighter';
    for(var j=0;j<parts.length;j++){
      var w=parts[j];
      drawDot(w, 0.85+0.15*Math.sin(now*0.004+w.ph));
    }
    ctx.restore();
    if(pulse>HOLD){ burst(now); }
  }
  else if(state==='burst'||state==='snow'){
    var bt=(now-t0)/1000;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(var k=0;k<parts.length;k++){
      var s=parts[k];
      if(state==='burst'){
        s.x+=s.vx*(1/60); s.y+=s.vy*(1/60);
        s.vy+=180*(1/60); s.vx*=0.995;
        drawDot(s, clamp(1.2-bt/1.15,0,1));
      }else{
        s.y+=s.vy*(1/60);
        s.x+=Math.sin(now*0.0006+s.ph)*0.35+s.vx*(1/60)*0.15;
        s.vy=Math.min(s.vy+2, 26+s.sz*10);
        s.vx*=0.99;
        if(s.y>H+20){ s.y=-20; s.x=Math.random()*W; }
        drawDot(s, 0.35+0.35*Math.sin(now*0.001+s.ph));
      }
    }
    ctx.restore();
    if(state==='burst'){
      if(bt<0.14){
        ctx.fillStyle='rgba(255,245,225,'+(1-bt/0.14)*0.30+')';
        ctx.fillRect(0,0,W,H);
      }
      if(bt>BURST){ state='snow'; t0=now; showWishes(); }
    }
  }

  requestAnimationFrame(frame);
}

function drawDot(p,alpha){
  var h=p.hue;
  var col = h<0.62 ? '255,232,190' : (h<0.86 ? '255,196,140' : '198,214,255');
  ctx.fillStyle='rgba('+col+','+(alpha*0.92)+')';
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.sz,0,6.283);
  ctx.fill();
  if(p.sz>2.2){
    ctx.fillStyle='rgba('+col+','+(alpha*0.13)+')';
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.sz*3.4,0,6.283);
    ctx.fill();
  }
}

/* ---------- 开场飘雪 ---------- */
var flakeSet=null;
function drawFallingSnow(now,k){
  if(!flakeSet || flakeSet.w!==W){
    flakeSet={w:W,items:[]};
    var n=W<620?60:110;
    for(var i=0;i<n;i++){
      flakeSet.items.push({x:Math.random()*W,y:Math.random()*H,
        r:0.5+Math.random()*1.8, sp:8+Math.random()*22, ph:Math.random()*6.283});
    }
  }
  ctx.save();
  for(var j=0;j<flakeSet.items.length;j++){
    var f=flakeSet.items[j];
    f.y+=f.sp*0.016;
    f.x+=Math.sin(now*0.0004+f.ph)*0.25;
    if(f.y>H+6){ f.y=-6; f.x=Math.random()*W; }
    ctx.fillStyle='rgba(226,238,255,'+(0.18+0.32*Math.abs(Math.sin(now*0.0009+f.ph)))*k+')';
    ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();
  }
  ctx.restore();
}

/* ---------- 爆开 ---------- */
function burst(now){
  state='burst'; t0=now;
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    var dx=p.tx-W/2, dy=p.ty-H*0.46;
    var d=Math.hypot(dx,dy)||1;
    var sp=140+Math.random()*260;
    p.vx=dx/d*sp+(Math.random()-0.5)*70;
    p.vy=dy/d*sp-40-Math.random()*90;
    p.x=p.tx; p.y=p.ty;
  }
}

/* ---------- 祝福 ---------- */
var LINES=[
  '愿你三冬暖','愿你春不寒','愿你天黑有灯','下雨有伞',
  '愿你一路上','有良人相伴','愿你所有快乐','无需假装',
  '愿你此生尽兴','赤诚善良','立冬快乐','岁岁平安'
];

function showWishes(){
  var host=document.createElement('div');
  host.id='wishlayer';
  document.body.appendChild(host);
  var isPhone=W<620;
  var cols=isPhone?2:3;
  var rows=Math.ceil(LINES.length/cols);
  var cellW=W/cols, cellH=(H*0.60)/rows;
  var base=isPhone?15:Math.min(21,W*0.015);

  LINES.forEach(function(txt,i){
    var el=document.createElement('div');
    el.className='wish';
    el.textContent=txt;
    var col=i%cols, row=Math.floor(i/cols);
    var isMain=(i>=LINES.length-2);
    if(isMain) el.classList.add('main');
    else if(i%3===1) el.classList.add('dim');
    var x=cellW*(col+0.5)+(Math.random()-0.5)*cellW*0.08;
    var y=H*0.19+cellH*(row+0.5)+(Math.random()-0.5)*cellH*0.12;
    el.style.left=x+'px';
    el.style.top=y+'px';
    el.style.fontSize=(base*(isMain?1.34:1)).toFixed(1)+'px';
    el.style.letterSpacing=isMain?'0.18em':'0.12em';
    host.appendChild(el);
    setTimeout(function(){ el.classList.add('on'); }, isMain? 1900 : 240+i*190);
  });

  setTimeout(function(){ document.getElementById('again').classList.add('on'); }, 3000);
}

/* ---------- 尺寸 ---------- */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);
  cvs.style.width=W+'px';cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2;CY=H*0.46;
  flakeSet=null;
  if(state!=='intro' && state!=='snow') buildParticles();
}

/* ---------- 交互 ---------- */
document.getElementById('intro').addEventListener('click',function(){
  if(state!=='intro') return;
  document.getElementById('intro').classList.add('gone');
  buildParticles();
  t0=performance.now();
  state='gather';
  window.__clicked=true;
});

document.getElementById('again').addEventListener('click',function(){ location.reload(); });

var rz=null;
window.addEventListener('resize',function(){
  clearTimeout(rz);
  rz=setTimeout(resize,200);
});

resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
